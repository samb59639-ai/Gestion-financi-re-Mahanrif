<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Cotisation Daara Mahanrif</title>
<link rel="icon" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#152018; --paper:#F7F3E8; --paper-warm:#EFE6D0;
    --emerald:#1E8449; --emerald-deep:#0F3D26;
    --gold:#C89B2C; --gold-light:#E9C868;
    --line: rgba(21,32,24,0.16); --radius:3px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Work Sans',sans-serif; font-size:15px;}
  h1{font-family:'Fraunces',serif; font-size:22px; color:var(--emerald-deep);}
  .wrap{max-width:640px; margin:0 auto; padding:32px 20px 80px;}
  header{display:flex; align-items:center; gap:12px; margin-bottom:28px;}
  header img{width:38px; height:38px; border-radius:50%;}
  .card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:18px;}

  #loginView label{display:block; font-size:13px; margin:14px 0 6px; color:#4a504a;}
  #loginView input{width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:var(--radius); font-family:inherit; font-size:14px;}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:var(--radius); font-weight:600;}
  .btn-primary{background:var(--emerald-deep); color:var(--paper); padding:12px 20px; font-size:14px; width:100%; margin-top:16px;}
  .btn-primary:hover{background:var(--emerald);}
  #loginError{color:#b03434; font-size:13px; margin-top:10px; display:none;}

  #appView{display:none;}
  .top-row{display:flex; justify-content:space-between; align-items:center;}
  .logout{background:none; color:#5b6259; font-size:13px; text-decoration:underline; font-weight:400;}
  .week-badge{font-family:'Space Mono',monospace; font-size:12px; background:var(--paper-warm); border:1px solid var(--line); padding:6px 10px; border-radius:var(--radius); color:var(--emerald-deep);}

  form.add-membre{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  form.add-membre input{flex:1; min-width:160px; padding:10px 12px; border:1.5px solid var(--line); border-radius:var(--radius); font-family:inherit; font-size:14px;}
  form.add-membre button{background:var(--gold); color:var(--emerald-deep); padding:10px 16px; font-size:13.5px;}
  form.add-membre button:hover{background:var(--gold-light);}

  .membre-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 4px; border-bottom:1px solid var(--line);
    font-size:14.5px;
  }
  .membre-row:last-child{border-bottom:none;}
  .membre-nom{font-weight:500;}
  .membre-actions{display:flex; align-items:center; gap:10px;}
  .paye-toggle{
    padding:8px 14px; font-size:12.5px; border:1.5px solid var(--line); background:var(--paper);
    color:var(--emerald-deep);
  }
  .paye-toggle.paid{background:var(--emerald-deep); color:var(--paper); border-color:var(--emerald-deep);}
  .empty{color:#5b6259; font-size:13.5px; padding:10px 4px;}
  .hint{font-size:12.5px; color:#5b6259; margin-top:4px;}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <img src="assets/logo.png" alt="">
    <h1>Cotisation — Espace admin</h1>
  </header>

  <!-- Vue connexion -->
  <div class="card" id="loginView">
    <p style="font-size:13.5px; color:#5b6259;">Connecte-toi avec le compte admin créé dans Firebase Authentication.</p>
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username">
    <label for="password">Mot de passe</label>
    <input type="password" id="password" autocomplete="current-password">
    <button class="btn-primary" id="loginBtn">Se connecter</button>
    <p id="loginError">Identifiants incorrects.</p>
  </div>

  <!-- Vue application -->
  <div id="appView">
    <div class="top-row">
      <span class="week-badge" id="weekBadge"></span>
      <button class="logout" id="logoutBtn">Se déconnecter</button>
    </div>

    <div class="card">
      <h2 style="font-size:15px; margin-bottom:4px;">Ajouter un membre</h2>
      <form class="add-membre" id="addForm">
        <input type="text" id="newNom" placeholder="Nom complet" required>
        <button type="submit">Ajouter</button>
      </form>
    </div>

    <div class="card">
      <h2 style="font-size:15px; margin-bottom:2px;">Pointage de la semaine</h2>
      <p class="hint">Coche un membre quand il a payé ses 250 F du mardi.</p>
      <div id="membresList" style="margin-top:12px;"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  const loginView = document.getElementById('loginView');
  const appView = document.getElementById('appView');
  const week = semaineId();
  document.getElementById('weekBadge').textContent = 'Semaine ' + week;

  // ── Connexion ──
  document.getElementById('loginBtn').addEventListener('click', () => {
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('password').value;
    auth.signInWithEmailAndPassword(email, pass)
      .catch(() => { document.getElementById('loginError').style.display = 'block'; });
  });
  document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());

  auth.onAuthStateChanged(user => {
    if (user) {
      loginView.style.display = 'none';
      appView.style.display = 'block';
      chargerMembres();
    } else {
      loginView.style.display = 'block';
      appView.style.display = 'none';
    }
  });

  // ── Ajouter un membre ──
  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const nomInput = document.getElementById('newNom');
    const nom = nomInput.value.trim();
    if (!nom) return;
    await db.collection('membres').add({ nom, dateAdhesion: firebase.firestore.FieldValue.serverTimestamp(), actif: true });
    nomInput.value = '';
    chargerMembres();
  });

  // ── Charger et afficher les membres + statut de paiement de la semaine ──
  async function chargerMembres() {
    const listEl = document.getElementById('membresList');
    listEl.innerHTML = '<p class="empty">Chargement…</p>';
    const snap = await db.collection('membres').where('actif', '==', true).orderBy('nom').get();
    if (snap.empty) {
      listEl.innerHTML = '<p class="empty">Aucun membre pour l’instant.</p>';
      return;
    }
    listEl.innerHTML = '';
    for (const doc of snap.docs) {
      const membre = doc.data();
      const paiementRef = db.collection('membres').doc(doc.id).collection('paiements').doc(week);
      const paiementSnap = await paiementRef.get();
      const paid = paiementSnap.exists;

      const row = document.createElement('div');
      row.className = 'membre-row';
      row.innerHTML = `
        <span class="membre-nom">${membre.nom}</span>
        <span class="membre-actions">
          <button class="paye-toggle ${paid ? 'paid' : ''}" data-id="${doc.id}">
            ${paid ? '✓ Payé' : 'Marquer payé'}
          </button>
        </span>`;
      row.querySelector('.paye-toggle').addEventListener('click', (e) => togglePaiement(doc.id, !paid, e.target));
      listEl.appendChild(row);
    }
  }

  // ── Marquer / annuler un paiement, et mettre à jour le compteur public ──
  async function togglePaiement(membreId, marquerPaye, btn) {
    const paiementRef = db.collection('membres').doc(membreId).collection('paiements').doc(week);
    const statsRef = db.collection('stats').doc(week);

    await db.runTransaction(async (tx) => {
      const statsDoc = await tx.get(statsRef);
      const current = statsDoc.exists ? (statsDoc.data().count || 0) : 0;
      if (marquerPaye) {
        tx.set(paiementRef, { montant: 250, date: firebase.firestore.FieldValue.serverTimestamp() });
        tx.set(statsRef, { count: current + 1 }, { merge: true });
      } else {
        tx.delete(paiementRef);
        tx.set(statsRef, { count: Math.max(0, current - 1) }, { merge: true });
      }
    });

    btn.classList.toggle('paid', marquerPaye);
    btn.textContent = marquerPaye ? '✓ Payé' : 'Marquer payé';
  }
</script>

</body>
</html>
